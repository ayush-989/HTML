<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> HTML Entities</title>
</head>
<body>
    <p>Some common &nbsp;  &nbsp; HTML entities:</p>
   
    <p> A &lt; B </p>
    <p>This is heart &hearts;</p>
    <p>This is spade &spades;</p>
    <p>This is music &musicalnote;</p>
    <p>This is infinity &infin;</p> 
    <p>This is copyright &copy;</p>
    <p>This is registered &reg;</p> 
    <p>This is trademark &trade;</p>
    <p>This is Euro &euro;</p>
    <p>This is Pound &pound;</p>
    <p>This is Yen &yen;</p>
    <br>
    <br>
    <hr>
    <p>The  Sky  is cloudy &nbsp; &#9729; &amp; &nbsp; it will rain &nbsp; &#9748; &nbsp;today</p>
</body>
</html>
